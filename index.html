&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;抵抗の回転ベクトルと交流の波形&lt;/h1&gt;
    &lt;p class=&quot;lead&quot;&gt;抵抗に流れる交流の電圧・電流を回転ベクトルで表します。ベクトルが角度 &lt;span class=&quot;m&quot;&gt;ωt&lt;/span&gt; だけ回ったとき、その &lt;span class=&quot;m&quot;&gt;y&lt;/span&gt; 成分が右のグラフの値になります。&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;toolbar&quot;&gt;
    &lt;div class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;表示する量&quot;&gt;
      &lt;button type=&quot;button&quot; data-mode=&quot;V&quot; aria-pressed=&quot;true&quot;&gt;電圧&lt;/button&gt;
      &lt;button type=&quot;button&quot; data-mode=&quot;I&quot; aria-pressed=&quot;false&quot;&gt;電流&lt;/button&gt;
      &lt;button type=&quot;button&quot; data-mode=&quot;B&quot; aria-pressed=&quot;false&quot;&gt;両方&lt;/button&gt;
    &lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;play&quot; id=&quot;play&quot;&gt;❚❚ 一時停止&lt;/button&gt;
    &lt;div class=&quot;speed&quot;&gt;&lt;label for=&quot;spd&quot;&gt;速さ&lt;/label&gt;
      &lt;select id=&quot;spd&quot;&gt;
        &lt;option value=&quot;8&quot;&gt;ゆっくり&lt;/option&gt;
        &lt;option value=&quot;5&quot; selected&gt;ふつう&lt;/option&gt;
        &lt;option value=&quot;2.5&quot;&gt;はやい&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stage&quot;&gt;
    &lt;svg id=&quot;svg&quot; viewBox=&quot;0 0 900 400&quot; aria-label=&quot;回転ベクトルと波形のグラフ&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;slider&quot;&gt;
    &lt;label for=&quot;theta&quot;&gt;&lt;span class=&quot;m&quot;&gt;ωt&lt;/span&gt; を動かす&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;theta&quot; min=&quot;0&quot; max=&quot;1000&quot; value=&quot;0&quot;&gt;
  &lt;/div&gt;

  &lt;div class=&quot;readout&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;回転角&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;rAng&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card v&quot; id=&quot;cardV&quot;&gt;&lt;div class=&quot;k&quot;&gt;電圧の瞬時値&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;rV&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card i&quot; id=&quot;cardI&quot;&gt;&lt;div class=&quot;k&quot;&gt;電流の瞬時値&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;rI&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;ul class=&quot;notes&quot;&gt;
    &lt;li&gt;回転ベクトルの長さ = 最大値（&lt;span class=&quot;m&quot;&gt;V&lt;/span&gt;&lt;sub&gt;R0&lt;/sub&gt;, &lt;span class=&quot;m&quot;&gt;I&lt;/span&gt;&lt;sub&gt;R0&lt;/sub&gt;）、回転の角速度 = &lt;span class=&quot;m&quot;&gt;ω&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;ベクトルの先端から横に引いた点線が、グラフ上のその時刻の点につながります。&lt;/li&gt;
    &lt;li&gt;抵抗では電圧と電流のベクトルが同じ向きにそろって回る（位相が同じ）ことを「両方」で確認できます。&lt;/li&gt;
    &lt;li&gt;グラフやベクトルの円をドラッグしても角度を動かせます。&lt;/li&gt;
  &lt;/ul&gt;

&lt;script&gt;
(function(){
  const NS=&quot;http://www.w3.org/2000/svg&quot;;
  const svg=document.getElementById(&quot;svg&quot;);
  const cx=190, cy=200, x0=400, xEnd=880;
  const R={V:150,I:95};
  const k=380/(2*Math.PI);           // px per rad on the graph
  const TMAX=(xEnd-10-x0)/k;         // max angle drawn
  const col={V:&quot;var(--v)&quot;,I:&quot;var(--i)&quot;};
  const soft={V:&quot;var(--v-soft)&quot;,I:&quot;var(--i-soft)&quot;};
  let mode=&quot;V&quot;, theta=0, playing=!matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches, period=5;

  function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);(parent||svg).appendChild(e);return e;}
  function txt(s,x,y,attrs,parent){const t=el(&quot;text&quot;,Object.assign({x,y},attrs||{}),parent);t.textContent=s;return t;}

  // defs: arrowheads
  const defs=el(&quot;defs&quot;,{});
  [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
    const m=el(&quot;marker&quot;,{id:&quot;ah&quot;+q,viewBox:&quot;0 0 10 10&quot;,refX:&quot;8&quot;,refY:&quot;5&quot;,markerWidth:&quot;5&quot;,markerHeight:&quot;5&quot;,orient:&quot;auto-start-reverse&quot;},defs);
    el(&quot;path&quot;,{d:&quot;M0,0 L10,5 L0,10 z&quot;,fill:col[q]},m);
  });
  const m2=el(&quot;marker&quot;,{id:&quot;ax&quot;,viewBox:&quot;0 0 10 10&quot;,refX:&quot;8&quot;,refY:&quot;5&quot;,markerWidth:&quot;7&quot;,markerHeight:&quot;7&quot;,orient:&quot;auto&quot;},defs);
  el(&quot;path&quot;,{d:&quot;M0,1 L10,5 L0,9 z&quot;,fill:&quot;var(--axis)&quot;},m2);

  // static axes
  el(&quot;line&quot;,{x1:25,y1:cy,x2:360,y2:cy,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  el(&quot;line&quot;,{x1:cx,y1:375,x2:cx,y2:22,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  txt(&quot;x&quot;,352,222); txt(&quot;y&quot;,200,30); txt(&quot;O&quot;,cx-22,cy+22,{style:&quot;font-style:normal&quot;});
  el(&quot;line&quot;,{x1:x0,y1:cy,x2:xEnd+10,y2:cy,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  el(&quot;line&quot;,{x1:x0,y1:375,x2:x0,y2:22,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  txt(&quot;t&quot;,xEnd+2,222); txt(&quot;O&quot;,x0-22,cy+22,{style:&quot;font-style:normal&quot;});
  // period ticks on t axis
  const tickLbl=[&quot;T/4&quot;,&quot;T/2&quot;,&quot;3T/4&quot;,&quot;T&quot;,&quot;5T/4&quot;];
  for(let n=1;n&lt;=4;n++){const x=x0+k*n*Math.PI/2; if(x&gt;xEnd) break;
    el(&quot;line&quot;,{x1:x,y1:cy-4,x2:x,y2:cy+4,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1});
    txt(tickLbl[n-1],x-12,cy+20,{&quot;font-size&quot;:12,fill:&quot;var(--muted)&quot;,style:&quot;fill:var(--muted)&quot;});}

  // per-quantity layers
  const L={};
  [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
    const g=el(&quot;g&quot;,{});
    const r=R[q];
    L[q]={g,
      circle:el(&quot;circle&quot;,{cx,cy,r,fill:&quot;none&quot;,stroke:col[q],&quot;stroke-width&quot;:1.4},g),
      guideTop:el(&quot;line&quot;,{x1:cx,y1:cy-r,x2:xEnd,y2:cy-r,stroke:col[q],&quot;stroke-width&quot;:1,&quot;stroke-dasharray&quot;:&quot;5 5&quot;,opacity:.55},g),
      guideBot:el(&quot;line&quot;,{x1:cx,y1:cy+r,x2:xEnd,y2:cy+r,stroke:col[q],&quot;stroke-width&quot;:1,&quot;stroke-dasharray&quot;:&quot;5 5&quot;,opacity:.55},g),
      ghost:el(&quot;path&quot;,{fill:&quot;none&quot;,stroke:col[q],&quot;stroke-width&quot;:1.5,opacity:.22},g),
      trace:el(&quot;path&quot;,{fill:&quot;none&quot;,stroke:col[q],&quot;stroke-width&quot;:3.2,&quot;stroke-linecap&quot;:&quot;round&quot;},g),
      comp:el(&quot;line&quot;,{stroke:col[q],&quot;stroke-width&quot;:5,&quot;stroke-linecap&quot;:&quot;round&quot;,opacity:.45},g),
      proj:el(&quot;line&quot;,{stroke:col[q],&quot;stroke-width&quot;:1.4,&quot;stroke-dasharray&quot;:&quot;6 4&quot;},g),
      drop:el(&quot;line&quot;,{stroke:col[q],&quot;stroke-width&quot;:1,&quot;stroke-dasharray&quot;:&quot;3 4&quot;,opacity:.8},g),
      vec:el(&quot;line&quot;,{x1:cx,y1:cy,stroke:col[q],&quot;stroke-width&quot;:4,&quot;marker-end&quot;:&quot;url(#ah&quot;+q+&quot;)&quot;},g),
      tipDot:el(&quot;circle&quot;,{r:4.5,fill:col[q]},g),
      dot:el(&quot;circle&quot;,{r:6,fill:col[q],stroke:&quot;var(--panel)&quot;,&quot;stroke-width&quot;:2},g),
      label:txt(&quot;&quot;,0,0,{&quot;font-size&quot;:20,style:&quot;fill:&quot;+col[q]},g)
    };
    // ghost full curve
    let d=&quot;&quot;;for(let a=0;a&lt;=TMAX;a+=0.02){d+=(a?&quot;L&quot;:&quot;M&quot;)+(x0+k*a).toFixed(1)+&quot;,&quot;+(cy-r*Math.sin(a)).toFixed(1);}
    L[q].ghost.setAttribute(&quot;d&quot;,d);
  });
  // angle arc
  const arc=el(&quot;path&quot;,{fill:&quot;var(--arc)&quot;,opacity:.55});
  const arcLine=el(&quot;path&quot;,{fill:&quot;none&quot;,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.3});
  const arcLbl=txt(&quot;ωt&quot;,0,0,{&quot;font-size&quot;:18});
  const tLbl=txt(&quot;t&quot;,0,0,{&quot;font-size&quot;:17});
  // bring vectors on top of arc
  svg.appendChild(L.I.g); svg.appendChild(L.V.g);
  // formula labels on graph
  const fV=txt(&quot;&quot;,0,0,{&quot;font-size&quot;:17,style:&quot;fill:var(--v)&quot;}), fI=txt(&quot;&quot;,0,0,{&quot;font-size&quot;:17,style:&quot;fill:var(--i)&quot;});
  fV.innerHTML=&#x27;V&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot;&gt;R&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; = V&lt;/tspan&gt;&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot;&gt;R0&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; sin ωt&lt;/tspan&gt;&#x27;;
  fI.innerHTML=&#x27;I&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot;&gt;R&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; = I&lt;/tspan&gt;&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot;&gt;R0&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; sin ωt&lt;/tspan&gt;&#x27;;
  fV.setAttribute(&quot;x&quot;,700);fV.setAttribute(&quot;y&quot;,36);fI.setAttribute(&quot;x&quot;,700);fI.setAttribute(&quot;y&quot;,60);

  const rAng=document.getElementById(&quot;rAng&quot;),rV=document.getElementById(&quot;rV&quot;),rI=document.getElementById(&quot;rI&quot;);
  const slider=document.getElementById(&quot;theta&quot;);

  function render(){
    const vis={V:mode!==&quot;I&quot;,I:mode!==&quot;V&quot;};
    const s=Math.sin(theta),c=Math.cos(theta);
    const gx=x0+k*theta;
    [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
      const o=L[q],r=R[q];
      o.g.style.display=vis[q]?&quot;&quot;:&quot;none&quot;;
      const tx=cx+r*c, ty=cy-r*s;
      o.vec.setAttribute(&quot;x2&quot;,cx+(r-3)*c); o.vec.setAttribute(&quot;y2&quot;,cy-(r-3)*s);
      o.tipDot.setAttribute(&quot;cx&quot;,tx);o.tipDot.setAttribute(&quot;cy&quot;,ty);
      o.comp.setAttribute(&quot;x1&quot;,tx);o.comp.setAttribute(&quot;y1&quot;,cy);o.comp.setAttribute(&quot;x2&quot;,tx);o.comp.setAttribute(&quot;y2&quot;,ty);
      o.proj.setAttribute(&quot;x1&quot;,tx);o.proj.setAttribute(&quot;y1&quot;,ty);o.proj.setAttribute(&quot;x2&quot;,gx);o.proj.setAttribute(&quot;y2&quot;,ty);
      o.drop.setAttribute(&quot;x1&quot;,gx);o.drop.setAttribute(&quot;y1&quot;,ty);o.drop.setAttribute(&quot;x2&quot;,gx);o.drop.setAttribute(&quot;y2&quot;,cy);
      o.dot.setAttribute(&quot;cx&quot;,gx);o.dot.setAttribute(&quot;cy&quot;,ty);
      let d=&quot;&quot;;const step=0.02;for(let a=0;a&lt;theta;a+=step){d+=(a?&quot;L&quot;:&quot;M&quot;)+(x0+k*a).toFixed(1)+&quot;,&quot;+(cy-r*Math.sin(a)).toFixed(1);}
      d+=(d?&quot;L&quot;:&quot;M&quot;)+gx.toFixed(1)+&quot;,&quot;+ty.toFixed(1);
      o.trace.setAttribute(&quot;d&quot;,d);
      // vector label near tip
      const lx=cx+(r+22)*c, ly=cy-(r+22)*s;
      o.label.setAttribute(&quot;x&quot;,lx-10);o.label.setAttribute(&quot;y&quot;,ly+7);
      o.label.innerHTML=(q===&quot;V&quot;?&quot;V&quot;:&quot;I&quot;)+&#x27;&lt;tspan font-size=&quot;13&quot; dy=&quot;4&quot; style=&quot;font-style:normal&quot;&gt;R&lt;/tspan&gt;&#x27;;
    });
    // offset labels when both shown so they don&#x27;t collide
    if(mode===&quot;B&quot;){const o=L.I;const lx=cx+(R.I-30)*c+14*s, ly=cy-(R.I-30)*s+14*c; o.label.setAttribute(&quot;x&quot;,lx-10);o.label.setAttribute(&quot;y&quot;,ly+7);}
    fV.style.display=mode!==&quot;I&quot;?&quot;&quot;:&quot;none&quot;; fI.style.display=mode!==&quot;V&quot;?&quot;&quot;:&quot;none&quot;;
    if(mode===&quot;I&quot;) fI.setAttribute(&quot;y&quot;,36); else fI.setAttribute(&quot;y&quot;,60);
    // arc
    const ar=38, a=theta%(2*Math.PI), big=a&gt;Math.PI?1:0;
    const ex=cx+ar*Math.cos(a), ey=cy-ar*Math.sin(a);
    if(a&lt;0.001){arc.setAttribute(&quot;d&quot;,&quot;&quot;);arcLine.setAttribute(&quot;d&quot;,&quot;&quot;);}
    else{arc.setAttribute(&quot;d&quot;,`M${cx},${cy} L${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey} Z`);
      arcLine.setAttribute(&quot;d&quot;,`M${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey}`);}
    const ha=a/2, lr=ar+18;

      let d=&quot;&quot;;for(let a=0;a&lt;=TMAX;a+=0.02){d+=(a?&quot;L&quot;:&quot;M&quot;)+(x0+k*a).toFixed(1)+&quot;,&quot;+(cy-R[q]*Math.sin(a+ph[q])).toFixed(1);}
      L[q].ghost.setAttribute(&quot;d&quot;,d);
    });
    fV.innerHTML=svgFormula(&quot;V&quot;,ph.V); fI.innerHTML=svgFormula(&quot;I&quot;,ph.I);
  }

  const rAng=document.getElementById(&quot;rAng&quot;),rV=document.getElementById(&quot;rV&quot;),rI=document.getElementById(&quot;rI&quot;);
  const slider=document.getElementById(&quot;theta&quot;);

  function render(){
    const vis={V:mode!==&quot;I&quot;,I:mode!==&quot;V&quot;};
    const ph=phases(), gx=x0+k*theta;
    const val={};
    [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
      const o=L[q],r=R[q],a=theta+ph[q],s=Math.sin(a),c=Math.cos(a);
      val[q]=s;
      o.g.style.display=vis[q]?&quot;&quot;:&quot;none&quot;;
      const tx=cx+r*c, ty=cy-r*s;
      o.vec.setAttribute(&quot;x2&quot;,cx+(r-3)*c); o.vec.setAttribute(&quot;y2&quot;,cy-(r-3)*s);
      o.tipDot.setAttribute(&quot;cx&quot;,tx);o.tipDot.setAttribute(&quot;cy&quot;,ty);
      o.comp.setAttribute(&quot;x1&quot;,tx);o.comp.setAttribute(&quot;y1&quot;,cy);o.comp.setAttribute(&quot;x2&quot;,tx);o.comp.setAttribute(&quot;y2&quot;,ty);
      o.proj.setAttribute(&quot;x1&quot;,tx);o.proj.setAttribute(&quot;y1&quot;,ty);o.proj.setAttribute(&quot;x2&quot;,gx);o.proj.setAttribute(&quot;y2&quot;,ty);
      o.drop.setAttribute(&quot;x1&quot;,gx);o.drop.setAttribute(&quot;y1&quot;,ty);o.drop.setAttribute(&quot;x2&quot;,gx);o.drop.setAttribute(&quot;y2&quot;,cy);
      o.dot.setAttribute(&quot;cx&quot;,gx);o.dot.setAttribute(&quot;cy&quot;,ty);
      let d=&quot;&quot;;for(let b=0;b&lt;theta;b+=0.02){d+=(b?&quot;L&quot;:&quot;M&quot;)+(x0+k*b).toFixed(1)+&quot;,&quot;+(cy-r*Math.sin(b+ph[q])).toFixed(1);}
      d+=(d?&quot;L&quot;:&quot;M&quot;)+gx.toFixed(1)+&quot;,&quot;+ty.toFixed(1);
      o.trace.setAttribute(&quot;d&quot;,d);
      o.label.setAttribute(&quot;x&quot;,cx+(r+22)*c-10);o.label.setAttribute(&quot;y&quot;,cy-(r+22)*s+7);

    else{arc.setAttribute(&quot;d&quot;,`M${cx},${cy} L${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey} Z`);
      arcLine.setAttribute(&quot;d&quot;,`M${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey}`);}

    fI.setAttribute(&quot;x&quot;,680);fI.setAttribute(&quot;y&quot;,vis.V?60:36);
    tLbl.setAttribute(&quot;x&quot;,gx-4);tLbl.setAttribute(&quot;y&quot;,cy+38);
    // readouts
    const deg=theta*180/Math.PI;
    rAng.innerHTML=`&lt;span class=&quot;m&quot;&gt;ωt&lt;/span&gt; = ${deg.toFixed(0)}°`+`　&lt;span style=&quot;color:var(--muted);font-size:.9rem&quot;&gt;t = ${(theta/(2*Math.PI)).toFixed(2)} T&lt;/span&gt;`;
    const f=s=&gt;(s&gt;=-0.005?&quot;+&quot;:&quot;−&quot;)+Math.abs(s).toFixed(2);
    rV.innerHTML=`&lt;span class=&quot;m&quot;&gt;V&lt;/span&gt;&lt;sub&gt;${X}&lt;/sub&gt; = ${f(val.V)} &lt;span class=&quot;m&quot;&gt;V&lt;/span&gt;&lt;sub&gt;${X}0&lt;/sub&gt;`;
    rI.innerHTML=`&lt;span class=&quot;m&quot;&gt;I&lt;/span&gt;&lt;sub&gt;${X}&lt;/sub&gt; = ${f(val.I)} &lt;span class=&quot;m&quot;&gt;I&lt;/span&gt;&lt;sub&gt;${X}0&lt;/sub&gt;`;
    document.getElementById(&quot;cardV&quot;).style.opacity=vis.V?1:.35;

  }

  document.querySelectorAll(&quot;[data-mode]&quot;).forEach(b=&gt;b.addEventListener(&quot;click&quot;,()=&gt;{
    mode=b.dataset.mode;

  document.querySelectorAll(&quot;[data-ref]&quot;).forEach(b=&gt;b.addEventListener(&quot;click&quot;,()=&gt;{

  function setPlay(p){playing=p;playBtn.textContent=p?&quot;❚❚ 一時停止&quot;:&quot;▶ 再生&quot;;last=null;}

  function svgPt(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  let dragging=false;

    const p=svgPt(ev);
    if(p.x&gt;=x0){theta=Math.min(TMAX,Math.max(0,(p.x-x0)/k));}
    else{
      // drag the visible vector; convert its angle back to ωt
      const q=mode===&quot;I&quot;?&quot;I&quot;:(mode===&quot;V&quot;?&quot;V&quot;:ref);
      let a=Math.atan2(cy-p.y,p.x-cx)-phases()[q];

  svg.addEventListener(&quot;pointerup&quot;,()=&gt;dragging=false);
  svg.addEventListener(&quot;pointercancel&quot;,()=&gt;dragging=false);

  function loop(ts){
    if(playing){
      if(last!==null){theta+=(ts-last)/1000*(2*Math.PI/period); if(theta&gt;TMAX)theta=0;}
      last=ts; render();
    } else last=null;
    requestAnimationFrame(loop);
  }
  setPlay(playing);
  if(!playing) theta=Math.PI/5;
  buildStatic(); render();
  requestAnimationFrame(loop);
})();

    &lt;li&gt;「式の基準」で、電流と電圧のどちらを sin &lt;span class=&quot;m&quot;&gt;ωt&lt;/span&gt; とおくかを切り替えられます（教科書の書き方に合わせてください）。&lt;/li&gt;

&lt;script&gt;

  el(&quot;line&quot;,{x1:cx,y1:375,x2:cx,y2:22,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  txt(&quot;x&quot;,352,222); txt(&quot;y&quot;,200,30); txt(&quot;O&quot;,cx-22,cy+22,{style:&quot;font-style:normal&quot;});

  el(&quot;line&quot;,{x1:x0,y1:375,x2:x0,y2:22,stroke:&quot;var(--axis)&quot;,&quot;stroke-width&quot;:1.4,&quot;marker-end&quot;:&quot;url(#ax)&quot;});
  txt(&quot;t&quot;,xEnd+2,222); txt(&quot;O&quot;,x0-22,cy+22,{style:&quot;font-style:normal&quot;});
  const tickLbl=[&quot;T/4&quot;,&quot;T/2&quot;,&quot;3T/4&quot;,&quot;T&quot;];

  const L={};
  [&quot;I&quot;,&quot;V&quot;].forEach(q=&gt;{

      guideBot:el(&quot;line&quot;,{x1:cx,y1:cy+r,x2:xEnd,y2:cy+r,stroke:col[q],&quot;stroke-width&quot;:1,&quot;stroke-dasharray&quot;:&quot;5 5&quot;,opacity:.55},g),
      ghost:el(&quot;path&quot;,{fill:&quot;none&quot;,stroke:col[q],&quot;stroke-width&quot;:1.5,opacity:.22},g),
      trace:el(&quot;path&quot;,{fill:&quot;none&quot;,stroke:col[q],&quot;stroke-width&quot;:3.2,&quot;stroke-linecap&quot;:&quot;round&quot;},g),
      comp:el(&quot;line&quot;,{stroke:col[q],&quot;stroke-width&quot;:5,&quot;stroke-linecap&quot;:&quot;round&quot;,opacity:.45},g),
      proj:el(&quot;line&quot;,{stroke:col[q],&quot;stroke-width&quot;:1.4,&quot;stroke-dasharray&quot;:&quot;6 4&quot;},g),

  });
  const tLbl=txt(&quot;t&quot;,0,0,{&quot;font-size&quot;:17});
  const fV=txt(&quot;&quot;,0,0,{&quot;font-size&quot;:17,style:&quot;fill:var(--v)&quot;}), fI=txt(&quot;&quot;,0,0,{&quot;font-size&quot;:17,style:&quot;fill:var(--i)&quot;});

  function phaseStr(p){ if(Math.abs(p)&lt;1e-9) return &quot; sin ωt&quot;; return p&gt;0?&quot; sin(ωt + π/2)&quot;:&quot; sin(ωt − π/2)&quot;; }
  function svgFormula(q,p){ return q+&#x27;&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot; style=&quot;font-style:normal&quot;&gt;&#x27;+X+&#x27;&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; = &#x27;+q+&#x27;&lt;/tspan&gt;&lt;tspan font-size=&quot;12&quot; dy=&quot;4&quot; style=&quot;font-style:normal&quot;&gt;&#x27;+X+&#x27;0&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt;&#x27;+phaseStr(p)+&#x27;&lt;/tspan&gt;&#x27;; }
  function buildStatic(){
    const ph=phases();
    [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
      let d=&quot;&quot;;for(let a=0;a&lt;=TMAX;a+=0.02){d+=(a?&quot;L&quot;:&quot;M&quot;)+(x0+k*a).toFixed(1)+&quot;,&quot;+(cy-R[q]*Math.sin(a+ph[q])).toFixed(1);}

  }

  const rAng=document.getElementById(&quot;rAng&quot;),rV=document.getElementById(&quot;rV&quot;),rI=document.getElementById(&quot;rI&quot;);
  const slider=document.getElementById(&quot;theta&quot;);

  function render(){
    const vis={V:mode!==&quot;I&quot;,I:mode!==&quot;V&quot;};
    const ph=phases(), gx=x0+k*theta;
    const val={};
    [&quot;V&quot;,&quot;I&quot;].forEach(q=&gt;{
      const o=L[q],r=R[q],a=theta+ph[q],s=Math.sin(a),c=Math.cos(a);
      val[q]=s;
      o.g.style.display=vis[q]?&quot;&quot;:&quot;none&quot;;

      o.drop.setAttribute(&quot;x1&quot;,gx);o.drop.setAttribute(&quot;y1&quot;,ty);o.drop.setAttribute(&quot;x2&quot;,gx);o.drop.setAttribute(&quot;y2&quot;,cy);
      o.dot.setAttribute(&quot;cx&quot;,gx);o.dot.setAttribute(&quot;cy&quot;,ty);
      let d=&quot;&quot;;for(let b=0;b&lt;theta;b+=0.02){d+=(b?&quot;L&quot;:&quot;M&quot;)+(x0+k*b).toFixed(1)+&quot;,&quot;+(cy-r*Math.sin(b+ph[q])).toFixed(1);}
      d+=(d?&quot;L&quot;:&quot;M&quot;)+gx.toFixed(1)+&quot;,&quot;+ty.toFixed(1);
      o.trace.setAttribute(&quot;d&quot;,d);
      o.label.setAttribute(&quot;x&quot;,cx+(r+22)*c-10);o.label.setAttribute(&quot;y&quot;,cy-(r+22)*s+7);
    });
    // ωt arc to reference direction

    const ex=cx+ar*Math.cos(a), ey=cy-ar*Math.sin(a);
    if(a&lt;0.001){arc.setAttribute(&quot;d&quot;,&quot;&quot;);arcLine.setAttribute(&quot;d&quot;,&quot;&quot;);}
    else{arc.setAttribute(&quot;d&quot;,`M${cx},${cy} L${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey} Z`);
      arcLine.setAttribute(&quot;d&quot;,`M${cx+ar},${cy} A${ar},${ar} 0 ${big} 0 ${ex},${ey}`);}
    const ha=a/2, lr=ar+16;
    arcLbl.setAttribute(&quot;x&quot;,cx+lr*Math.cos(ha)-9);arcLbl.setAttribute(&quot;y&quot;,cy-lr*Math.sin(ha)+6);
    arcLbl.style.display=a&gt;0.4?&quot;&quot;:&quot;none&quot;;
    // reference ray when the reference vector is hidden
    refRay.style.display=vis[ref]?&quot;none&quot;:&quot;&quot;;
    refRay.setAttribute(&quot;x2&quot;,cx+R.V*Math.cos(theta));refRay.setAttribute(&quot;y2&quot;,cy-R.V*Math.sin(theta));
    // phase-difference arc between the two vectors
    const showPh=mode===&quot;B&quot;||!vis[ref];
    phArc.style.display=phLbl.style.display=showPh?&quot;&quot;:&quot;none&quot;;
    const a1=theta+Math.min(ph.V,ph.I), a2=theta+Math.max(ph.V,ph.I), pr=64;
    phArc.setAttribute(&quot;d&quot;,`M${cx+pr*Math.cos(a1)},${cy-pr*Math.sin(a1)} A${pr},${pr} 0 0 0 ${cx+pr*Math.cos(a2)},${cy-pr*Math.sin(a2)}`);
    const am=(a1+a2)/2;

    // formulas
    fV.style.display=vis.V?&quot;&quot;:&quot;none&quot;; fI.style.display=vis.I?&quot;&quot;:&quot;none&quot;;
    fV.setAttribute(&quot;x&quot;,680);fV.setAttribute(&quot;y&quot;,36);
    fI.setAttribute(&quot;x&quot;,680);fI.setAttribute(&quot;y&quot;,vis.V?60:36);
    tLbl.setAttribute(&quot;x&quot;,gx-4);tLbl.setAttribute(&quot;y&quot;,cy+38);
    // readouts
    const deg=theta*180/Math.PI;
    rAng.innerHTML=`&lt;span class=&quot;m&quot;&gt;ωt&lt;/span&gt; = ${deg.toFixed(0)}°`+`　&lt;span style=&quot;color:var(--muted);font-size:.9rem&quot;&gt;t = ${(theta/(2*Math.PI)).toFixed(2)} T&lt;/span&gt;`;
    const f=s=&gt;(s&gt;=-0.005?&quot;+&quot;:&quot;−&quot;)+Math.abs(s).toFixed(2);
    rV.innerHTML=`&lt;span class=&quot;m&quot;&gt;V&lt;/span&gt;&lt;sub&gt;${X}&lt;/sub&gt; = ${f(val.V)} &lt;span class=&quot;m&quot;&gt;V&lt;/span&gt;&lt;sub&gt;${X}0&lt;/sub&gt;`;
    rI.innerHTML=`&lt;span class=&quot;m&quot;&gt;I&lt;/span&gt;&lt;sub&gt;${X}&lt;/sub&gt; = ${f(val.I)} &lt;span class=&quot;m&quot;&gt;I&lt;/span&gt;&lt;sub&gt;${X}0&lt;/sub&gt;`;
    document.getElementById(&quot;cardV&quot;).style.opacity=vis.V?1:.35;

  document.querySelectorAll(&quot;[data-mode]&quot;).forEach(b=&gt;b.addEventListener(&quot;click&quot;,()=&gt;{
    mode=b.dataset.mode;

  }));
  const playBtn=document.getElementById(&quot;play&quot;);
  let last=null;
  function setPlay(p){playing=p;playBtn.textContent=p?&quot;❚❚ 一時停止&quot;:&quot;▶ 再生&quot;;last=null;}
  playBtn.addEventListener(&quot;click&quot;,()=&gt;setPlay(!playing));
  document.getElementById(&quot;spd&quot;).addEventListener(&quot;change&quot;,e=&gt;{period=+e.target.value;});
  slider.addEventListener(&quot;input&quot;,()=&gt;{setPlay(false);theta=slider.value/1000*TMAX;render();});

  function svgPt(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}

    else{
      // drag the visible vector; convert its angle back to ωt
      const q=mode===&quot;I&quot;?&quot;I&quot;:(mode===&quot;V&quot;?&quot;V&quot;:ref);

  }

  svg.addEventListener(&quot;pointermove&quot;,ev=&gt;{if(dragging)dragTo(ev);});
  svg.addEventListener(&quot;pointerup&quot;,()=&gt;dragging=false);
  svg.addEventListener(&quot;pointercancel&quot;,()=&gt;dragging=false);

  function loop(ts){
    if(playing){
      if(last!==null){theta+=(ts-last)/1000*(2*Math.PI/period); if(theta&gt;TMAX)theta=0;}
      last=ts; render();
    } else last=null;
    requestAnimationFrame(loop);
  }
  setPlay(playing);
  if(!playing) theta=Math.PI/5;
  buildStatic(); render();
  requestAnimationFrame(loop);
})();

<script>
const tabs=[...document.querySelectorAll('.tab')];
function fit(f){try{const d=f.contentDocument;if(d&&d.body)f.style.height=(d.documentElement.scrollHeight+10)+'px';}catch(e){}}
function show(k){
  if(!document.getElementById('f-'+k))k='resistor';
  tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k?'true':'false'));
  document.querySelectorAll('iframe').forEach(f=>{f.hidden=f.id!=='f-'+k; if(!f.hidden) fit(f);});
  history.replaceState(null,'','#'+k);
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.k)));
document.querySelectorAll('iframe').forEach(f=>{f.addEventListener('load',()=>fit(f));});
window.addEventListener('resize',()=>document.querySelectorAll('iframe:not([hidden])').forEach(fit));
setInterval(()=>document.querySelectorAll('iframe:not([hidden])').forEach(fit),1000);
show(location.hash.slice(1)||'resistor');
</script></body></html>
